name: my workflow

on:
  push:
    branches:
      - main
      - "releases/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
        with:
          token: ${{secrets.GITHUB_TOKEN}}

  greetings:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: say hello
        run: echo hello
