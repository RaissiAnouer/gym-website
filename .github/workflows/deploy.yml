name: my workflow

on:
  push:
    branches:
      - main
      - "releases/**"

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"

  build_docker_image:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - uses: actions/checkout@v3
        # - run: docker build -t gym-website:latest .
        run: ls -la
        with:
          token: ${{secrets.GITHUB_TOKEN}}
