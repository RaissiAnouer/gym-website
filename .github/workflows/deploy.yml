name: my workflow

on:
  push:
    branches:
      - main
      - "releases/**"

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
        with:
          token: ${{secrets.GITHUB_TOKEN}}

  build_docker_image:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - run: docker build -t gym-website:latest ../../
